name: Validate corporate POS
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  NX_DAEMON: 'false'
  NX_INTERACTIVE: 'false'
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --global npm@11.6.0
      - run: npm ci
      - run: npm run icons:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=low
      - name: Inventory complete dependency audit
        id: dependency-audit
        if: always()
        continue-on-error: true # Demo only: build-tool findings remain visible; production requires remediation.
        run: |
          audit_status=0
          npm audit --json > npm-audit-full.json || audit_status=$?
          node <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('npm-audit-full.json', 'utf8'));
          const counts = audit.metadata?.vulnerabilities;
          const lines = [
            '## Complete dependency audit',
            '',
            'Runtime audit is a blocking check. This inventory also includes build, lint and test tools.',
            'The complete audit keeps its nonzero exit code, with `continue-on-error` only for this demonstration.',
            'Resolve toolchain findings through compatible upstream releases before production distribution.',
            '',
          ];
          if (counts) {
            lines.push('| Severity | Affected packages |', '| --- | ---: |');
            for (const severity of ['critical', 'high', 'moderate', 'low', 'info', 'total']) {
              lines.push(`| ${severity} | ${counts[severity] ?? 0} |`);
            }
            lines.push('', 'Counts include packages affected through their dependencies; see the JSON artifact for full advisories.', '');
            const packages = Object.keys(audit.vulnerabilities ?? {}).sort();
            if (packages.length) {
              lines.push('| Package | Severity |', '| --- | --- |');
              for (const name of packages) lines.push(`| ${name} | ${audit.vulnerabilities[name].severity} |`);
            }
          } else {
            lines.push('The audit could not produce a vulnerability inventory. This is an audit error, not a clean result. Inspect the JSON artifact.');
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE
          exit "$audit_status"
      - name: Preserve complete audit inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-audit-inventory
          path: npm-audit-full.json
          if-no-files-found: warn
          retention-days: 7
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report
            test-results
          retention-days: 7
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --global npm@11.6.0
      - run: npm ci
      - run: rustup toolchain install 1.90.0 --profile minimal
      - run: npm run desktop:build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: corporate-pos-windows-demo
          path: |
            apps/pos-desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/pos-desktop/src-tauri/Cargo.lock
          retention-days: 7
